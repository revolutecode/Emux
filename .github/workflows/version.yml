name: version

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate version.json and CMake wiring
        run: python3 tools/version.py check

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 tools/version.py check --tag "${GITHUB_REF_NAME}"
